name: Eval Regression Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/retrieval/**"
      - "backend/app/generation/**"
      - "backend/app/ingestion/**"
      - "backend/app/eval/**"

jobs:
  eval-gate:
    name: Eval Regression Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragscope
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ragscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Run eval metric unit tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: ragscope
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ragscope_test
          REDIS_URL: redis://localhost:6379/0
          OLLAMA_BASE_URL: http://localhost:11434
          UPLOAD_DIR: /tmp/ragscope_uploads
        run: |
          cd backend
          pytest tests/test_eval.py -v --tb=short

      # Full eval regression against the committed golden dataset.
      #
      # Requires a reachable model server. On a GitHub-hosted runner there is
      # no Ollama, so this is gated on RUN_FULL_EVAL being set — enable it on a
      # self-hosted runner (or once a hosted inference endpoint is configured).
      # Thresholds are deliberately below the current measured baseline so the
      # gate catches regressions rather than failing on noise.
      - name: Run full eval regression
        if: ${{ vars.RUN_FULL_EVAL == 'true' }}
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: ragscope
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ragscope_test
          REDIS_URL: redis://localhost:6379/0
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || 'http://localhost:11434' }}
          UPLOAD_DIR: /tmp/ragscope_uploads
        run: |
          cd backend
          python -m app.eval.ci_gate \
            --dataset ../eval-datasets/golden-v1.jsonl \
            --faithfulness-threshold 0.80 \
            --context-recall-threshold 0.70 \
            --ndcg-threshold 0.60
