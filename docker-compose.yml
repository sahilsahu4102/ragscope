version: "3.9"

services:
  # ── PostgreSQL + pgvector ────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragscope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-ragscope}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragscope}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Cache + Celery Broker) ────────────
  redis:
    image: redis:7-alpine
    container_name: ragscope-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama (Self-Hosted LLM) ─────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ragscope-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      # Keep models resident. The 5m default unloaded between queries and cost
      # ~3.8s reloading a 5.6GB model back off disk.
      OLLAMA_KEEP_ALIVE: "-1"
      # Allow the embedder and generator to be loaded at the same time.
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── FastAPI Backend ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragscope-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
      # Persist the cross-encoder checkpoint across container recreates —
      # otherwise it re-downloads from HuggingFace on every `up`.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    # NOTE: --reload and --workers are mutually exclusive; uvicorn ignores
    # --workers when reloading. Each worker would also hold its own copy of the
    # cross-encoder and BM25 index, so raise this deliberately, not by default.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Worker ────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragscope-celery-worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  # ── Next.js Frontend ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: ragscope-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  upload_data:
  hf_cache:
