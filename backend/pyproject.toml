[project]
name = "ragscope-backend"
version = "0.1.0"
description = "RAGScope — Self-hosted production RAG platform with evaluation & observability"
requires-python = ">=3.11"
dependencies = [
    # ── Web Framework ─────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",

    # ── Database ──────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",

    # ── Redis / Task Queue ────────────────────
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",

    # ── LLM / Embeddings ─────────────────────
    "ollama>=0.4.0",
    "google-genai>=1.0.0",
    "sentence-transformers>=3.0.0",

    # ── Document Parsing ─────────────────────
    "docling>=2.0.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",

    # ── Chunking / RAG ────────────────────────
    "langchain-text-splitters>=0.2.0",
    "rank-bm25>=0.2.2",

    # ── Observability ─────────────────────────
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "structlog>=24.1.0",

    # ── Utilities ─────────────────────────────
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
eval = [
    "ragas>=0.2.0",
    "deepeval>=1.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes (errors), I: isort, N: naming
# B: bugbear (critical bugs only), RUF: ruff-native
# Excluded: SIM (style), UP (upgrade hints), B905 (zip strict) — too noisy pre-Phase3
select = ["E", "F", "W", "I", "N", "B", "RUF"]
ignore = [
    "B008",   # Depends() in FastAPI defaults is idiomatic
    "B904",   # raise from exc — cosmetic in Celery retry pattern
    "RUF012", # ClassVar annotation — cosmetic
    "E501",   # line too long — handled by formatter, not linter
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
